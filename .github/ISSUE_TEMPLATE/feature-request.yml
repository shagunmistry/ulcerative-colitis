name: Feature request
description: Suggest something the site should do.
title: "Feature: "
body:
  - type: markdown
    attributes:
      value: "**This issue is public. Do not include personal health details.**"
  - type: textarea
    id: need
    attributes:
      label: What do you need to do, and why can't you today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
